<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ติดตามแผ่นดินไหว — กรมอุตุนิยมวิทยา</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
        /* ===== Root ===== */
        :root {
            --bg: #10141a;
            --panel: #171d25;
            --panel-2: #1d2530;
            --hairline: #2a323d;
            --text: #e8edf2;
            --muted: #8994a3;
            --muted-2: #5f6b79;
            --sev-low: #3f9e8a;
            --sev-mid: #d99a3b;
            --sev-high: #d1442c;
            --sev-severe: #ef2d4e;
            --focus: #4fa3ff;
        }
        * {
            box-sizing: border-box;
        }
        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: 'Sarabun', sans-serif;
            overflow: hidden;
        }
        h1,
        h2,
        h3,
        .mono,
        .magnitude,
        .brand small,
        .stat-num,
        button {
            font-family: 'Chakra Petch', 'Sarabun', sans-serif;
        }
        #app {
            display: flex;
            height: 100vh;
            width: 100vw;
        }

        /* ===== Sidebar ===== */
        #sidebar {
            width: 380px;
            min-width: 380px;
            height: 100%;
            background: var(--panel);
            border-right: 1px solid var(--hairline);
            display: flex;
            flex-direction: column;
            transition: margin-left .32s cubic-bezier(.4, 0, .2, 1), width .32s cubic-bezier(.4, 0, .2, 1), min-width .32s cubic-bezier(.4, 0, .2, 1);
            position: relative;
            z-index: 20;
        }
        #sidebar.collapsed {
            margin-left: -380px;
        }
        @media (max-width:640px) {
            #sidebar {
                width: 88vw;
                min-width: 88vw;
                position: absolute;
                top: 0;
                bottom: 0;
                left: 0;
                box-shadow: 20px 0 40px rgba(0, 0, 0, .4);
            }
            #sidebar.collapsed {
                margin-left: -88vw;
            }
        }

        .sb-header {
            padding: 20px 20px 16px 20px;
            border-bottom: 1px solid var(--hairline);
            background: linear-gradient(180deg, var(--panel-2), var(--panel));
        }
        .brand {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 6px 12px;
        }
        .brand-left {
            display: flex;
            align-items: baseline;
            gap: 8px;
        }
        .brand .quake-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--sev-high);
            box-shadow: 0 0 0 4px rgba(209, 68, 44, .18);
            flex: none;
        }
        .brand h1 {
            font-size: 19px;
            font-weight: 600;
            margin: 0;
            letter-spacing: .2px;
        }
        .brand small {
            display: block;
            color: var(--muted);
            font-size: 12px;
            font-weight: 400;
            margin-top: 2px;
        }
        .brand-datetime {
            font-size: 13px;
            font-weight: 500;
            color: #c8d0da;
            text-align: right;
            white-space: nowrap;
            background: rgba(255, 255, 255, .05);
            padding: 4px 12px;
            border-radius: 20px;
            border: 1px solid var(--hairline);
            line-height: 1.6;
            font-variant-numeric: tabular-nums;
        }
        .brand-datetime .day-label {
            color: #8fcbff;
            font-weight: 600;
        }
        @media (max-width:640px) {
            .brand-datetime {
                font-size: 11px;
                padding: 2px 8px;
            }
        }

        .sb-stats {
            display: flex;
            gap: 10px;
            margin-top: 16px;
        }
        .stat {
            flex: 1;
            background: rgba(255, 255, 255, .03);
            border: 1px solid var(--hairline);
            border-radius: 6px;
            padding: 9px 10px;
        }
        .stat-num {
            font-size: 20px;
            font-weight: 600;
            line-height: 1;
        }
        .stat-label {
            font-size: 11px;
            color: var(--muted);
            margin-top: 4px;
        }

        .sb-toolbar {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 14px;
            flex-wrap: wrap;
        }
        #refreshBtn {
            flex: 1;
            background: var(--panel-2);
            border: 1px solid var(--hairline);
            color: var(--text);
            padding: 8px 10px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            transition: background .15s, border-color .15s;
        }
        #refreshBtn:hover {
            background: #242e3a;
            border-color: #3a4653;
        }
        #refreshBtn svg {
            width: 14px;
            height: 14px;
            transition: transform .5s;
        }
        #refreshBtn.spinning svg {
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        #lastUpdated {
            font-size: 11px;
            color: var(--muted-2);
            white-space: nowrap;
        }

        /* ===== ปุ่ม "ดูรอยเลื่อน" ===== */
        #faultToggleBtn {
            background: var(--panel-2);
            border: 1px solid var(--hairline);
            color: var(--muted);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: background .15s, border-color .15s, color .15s;
            flex: none;
            font-family: 'Sarabun', sans-serif;
        }
        #faultToggleBtn:hover {
            background: #242e3a;
            border-color: #3a4653;
        }
        #faultToggleBtn.active {
            color: var(--text);
            border-color: var(--sev-low);
            background: rgba(63, 158, 138, .15);
        }
        #faultToggleBtn .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--muted-2);
            display: inline-block;
            flex: none;
            transition: background .2s;
        }
        #faultToggleBtn.active .dot {
            background: var(--sev-low);
        }

        .sb-legend {
            display: flex;
            gap: 12px;
            padding: 12px 20px;
            border-bottom: 1px solid var(--hairline);
            font-size: 11px;
            color: var(--muted);
            flex-wrap: wrap;
        }
        .sb-legend span {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .sb-legend i {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }

        #list {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 6px 0;
        }
        #list::-webkit-scrollbar {
            width: 8px;
        }
        #list::-webkit-scrollbar-thumb {
            background: #2a323d;
            border-radius: 4px;
        }
        #list::-webkit-scrollbar-track {
            background: transparent;
        }

        .quake-item {
            display: flex;
            gap: 12px;
            padding: 12px 20px;
            cursor: pointer;
            border-bottom: 1px solid var(--hairline);
            border-left: 3px solid transparent;
            transition: background .15s, border-left-color .15s;
        }
        .quake-item:hover {
            background: rgba(255, 255, 255, .03);
        }
        .quake-item.active {
            background: rgba(79, 163, 255, .08);
            border-left-color: var(--focus);
        }

        .magnitude {
            flex: none;
            width: 46px;
            height: 46px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 15px;
            color: #0e1116;
        }
        .qi-body {
            flex: 1;
            min-width: 0;
        }
        .qi-title {
            font-size: 13.5px;
            font-weight: 500;
            line-height: 1.35;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .qi-meta {
            font-size: 11.5px;
            color: var(--muted);
            margin-top: 4px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .qi-meta span {
            display: flex;
            align-items: center;
            gap: 3px;
        }

        .empty-state,
        .loading-state,
        .error-state {
            padding: 40px 24px;
            text-align: center;
            color: var(--muted);
            font-size: 13px;
        }
        .error-state {
            color: var(--sev-high);
        }
        .loading-state .spinner {
            width: 22px;
            height: 22px;
            margin: 0 auto 12px auto;
            border: 2px solid var(--hairline);
            border-top-color: var(--focus);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        .retry-btn {
            margin-top: 12px;
            background: var(--panel-2);
            border: 1px solid var(--hairline);
            color: var(--text);
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
        }

        /* ===== Map ===== */
        #mapWrap {
            flex: 1;
            position: relative;
            height: 100%;
        }
        #map {
            width: 100%;
            height: 100%;
            background: #0b0e12;
        }

        #collapseTab {
            position: absolute;
            top: 20px;
            left: 0;
            z-index: 25;
            background: var(--panel);
            border: 1px solid var(--hairline);
            border-left: none;
            width: 26px;
            height: 52px;
            border-radius: 0 8px 8px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--muted);
            box-shadow: 2px 0 10px rgba(0, 0, 0, .25);
        }
        #collapseTab svg {
            width: 14px;
            height: 14px;
            transition: transform .32s;
        }
        #collapseTab.flipped svg {
            transform: rotate(180deg);
        }

        /* ===== นาฬิกากลางจอถูกซ่อน ===== */
        #clockOverlay {
            display: none !important;
        }

        /* ===== Leaflet popup ===== */
        .leaflet-popup-content-wrapper {
            background: var(--panel);
            color: var(--text);
            border-radius: 10px;
            border: 1px solid var(--hairline);
        }
        .leaflet-popup-tip {
            background: var(--panel);
        }
        .leaflet-popup-content {
            margin: 14px 16px;
            font-family: 'Sarabun', sans-serif;
        }
        .pop-mag {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-family: 'Chakra Petch', sans-serif;
            font-weight: 700;
            font-size: 13px;
            color: #0e1116;
            border-radius: 5px;
            padding: 2px 9px;
            margin-bottom: 8px;
        }
        .pop-title {
            font-size: 14.5px;
            font-weight: 600;
            line-height: 1.4;
            margin-bottom: 6px;
        }
        .pop-row {
            font-size: 12.5px;
            color: var(--muted);
            margin-top: 3px;
        }
        .pop-row b {
            color: var(--text);
            font-weight: 500;
        }
        .pop-comment {
            font-size: 12px;
            color: var(--muted);
            margin-top: 8px;
            border-top: 1px solid var(--hairline);
            padding-top: 8px;
        }
        .pop-link {
            display: inline-block;
            margin-top: 10px;
            font-size: 12px;
            color: var(--focus);
            text-decoration: none;
        }

        .leaflet-control-zoom a {
            background: var(--panel) !important;
            color: var(--text) !important;
            border-color: var(--hairline) !important;
        }
        .leaflet-control-attribution {
            background: rgba(23, 29, 37, .75) !important;
            color: var(--muted-2) !important;
        }
        .leaflet-control-attribution a {
            color: var(--muted) !important;
        }
    </style>
</head>
<body>

    <div id="app">
        <!-- ===== SIDEBAR ===== -->
        <aside id="sidebar">
            <div class="sb-header">
                <div class="brand">
                    <div class="brand-left">
                        <span class="quake-dot"></span>
                        <div>
                            <h1>ติดตามแผ่นดินไหว</h1>
                            <small>ข้อมูลจากกองเฝ้าระวังแผ่นดินไหว กรมอุตุนิยมวิทยา</small>
                        </div>
                    </div>
                    <div class="brand-datetime" id="brandDateTime">
                        <span class="day-label">–</span> – – --:--:--
                    </div>
                </div>

                <div class="sb-stats">
                    <div class="stat">
                        <div class="stat-num" id="statCount">–</div>
                        <div class="stat-label">เหตุการณ์ล่าสุด</div>
                    </div>
                    <div class="stat">
                        <div class="stat-num" id="statMax">–</div>
                        <div class="stat-label">ขนาดสูงสุด</div>
                    </div>
                    <div class="stat">
                        <div class="stat-num" id="statLatest">–</div>
                        <div class="stat-label">ชม. ก่อนหน้า</div>
                    </div>
                </div>

                <div class="sb-toolbar">
                    <button id="refreshBtn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6"/></svg>
                        รีเฟรชข้อมูล
                    </button>
                    <!-- ปุ่ม "ดูรอยเลื่อน" -->
                    <button id="faultToggleBtn" title="แสดง/ซ่อนรอยเลื่อนบนแผนที่">
                        <span class="dot"></span>
                        ดูรอยเลื่อน
                    </button>
                    <span id="lastUpdated">ยังไม่อัปเดต</span>
                </div>
            </div>

            <div class="sb-legend">
                <span><i style="background:var(--sev-low)"></i>&lt; 3.0</span>
                <span><i style="background:var(--sev-mid)"></i>3.0–4.4</span>
                <span><i style="background:var(--sev-high)"></i>4.5–5.9</span>
                <span><i style="background:var(--sev-severe)"></i>≥ 6.0</span>
            </div>

            <div id="list">
                <div class="loading-state" id="stateBox">
                    <div class="spinner"></div>
                    กำลังโหลดข้อมูลแผ่นดินไหว…
                </div>
            </div>
        </aside>

        <!-- ===== SIDEBAR COLLAPSE TAB ===== -->
        <div id="collapseTab" title="ย่อ/ขยายแถบข้อมูล">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M15 18l-6-6 6-6"/></svg>
        </div>

        <!-- ===== MAP WRAP ===== -->
        <div id="mapWrap">
            <div id="map"></div>
            <div id="clockOverlay" style="display:none;"></div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js">
    </script>
    <script>
        (function() {

            var ICON_URL = "https://maphub.net/media/markers/b/mo/bmoqwdmaegtllls8/80.png";
            var RSS_URL = "https://earthquake.tmd.go.th/feed/rss_tmd.xml";
            var FAULT_URL =
                "https://raw.githubusercontent.com/72media/my-file/refs/heads/main/%E0%B8%A3%E0%B8%AD%E0%B8%A2%E0%B9%80%E0%B8%A5%E0%B8%B7%E0%B9%88%E0%B8%AD%E0%B8%99%E0%B8%A1%E0%B8%B5%E0%B8%9E%E0%B8%A5%E0%B8%B1%E0%B8%87.geojson";

            // ========== LIVE THAI CLOCK ==========
            function updateBrandDateTime() {
                var now = new Date();
                var timeStr = now.toLocaleTimeString('th-TH', {
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit',
                    hour12: false
                });
                var dateParts = now.toLocaleDateString('th-TH', {
                    weekday: 'long',
                    day: 'numeric',
                    month: 'long',
                    year: 'numeric'
                }).split(' ');
                var weekday = dateParts[0] || '';
                var rest = dateParts.slice(1).join(' ') || '';
                document.getElementById('brandDateTime').innerHTML =
                    '<span class="day-label">' + weekday + '</span> ' + rest + ' ' + timeStr + ' น.';
            }

            updateBrandDateTime();
            setInterval(updateBrandDateTime, 1000);

            // ========== MAP SETUP ==========
            var map = L.map('map', { zoomControl: false, attributionControl: true }).setView([13.7, 100.5], 6);
            L.control.zoom({ position: 'bottomright' }).addTo(map);

            var googleHybrid = L.tileLayer("https://{s}.google.com/vt/lyrs=s,h&x={x}&y={y}&z={z}", {
                maxZoom: 20,
                subdomains: ['mt0', 'mt1', 'mt2', 'mt3'],
                attribution: 'Map data &copy; Google | Earthquake data &copy; <a href="https://earthquake.tmd.go.th" target="_blank" rel="noopener">TMD</a>'
            });
            googleHybrid.addTo(map);

            var quakeIcon = L.icon({
                iconUrl: ICON_URL,
                iconSize: [34, 34],
                iconAnchor: [17, 32],
                popupAnchor: [0, -30]
            });

            var markersLayer = L.layerGroup().addTo(map);
            var markerById = {};
            var itemElById = {};

            // ========== SIDEBAR COLLAPSE ==========
            var sidebar = document.getElementById('sidebar');
            var collapseTab = document.getElementById('collapseTab');
            collapseTab.addEventListener('click', function() {
                sidebar.classList.toggle('collapsed');
                collapseTab.classList.toggle('flipped');
                setTimeout(function() { map.invalidateSize(); }, 340);
            });

            // ========== SEVERITY HELPERS ==========
            function sevColor(mag) {
                if (mag >= 6) return getCss('--sev-severe');
                if (mag >= 4.5) return getCss('--sev-high');
                if (mag >= 3) return getCss('--sev-mid');
                return getCss('--sev-low');
            }

            function getCss(varName) {
                return getComputedStyle(document.documentElement).getPropertyValue(varName).trim();
            }

            function fmtDate(pubDateStr) {
                var d = new Date(pubDateStr);
                if (isNaN(d.getTime())) return pubDateStr;
                var opts = { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' };
                return d.toLocaleString('th-TH', opts) + ' น.';
            }

            function hoursAgo(pubDateStr) {
                var d = new Date(pubDateStr);
                if (isNaN(d.getTime())) return null;
                return (Date.now() - d.getTime()) / 3600000;
            }

            // ========== RSS PARSING ==========
            function parseRss(xmlText) {
                var doc = new DOMParser().parseFromString(xmlText, 'text/xml');
                var items = Array.prototype.slice.call(doc.getElementsByTagName('item'));
                var geoNS = 'http://www.w3.org/2003/01/geo/';
                var tmdNS = 'http://www.earthquake.tmd.go.th';

                function getTag(el, ns, tag, fallbackTag) {
                    var nodes = el.getElementsByTagNameNS(ns, tag);
                    if (nodes.length) return nodes[0].textContent.trim();
                    if (fallbackTag) {
                        var alt = el.getElementsByTagName(fallbackTag);
                        if (alt.length) return alt[0].textContent.trim();
                    }
                    return '';
                }

                return items.map(function(el, idx) {
                    var title = getTag(el, null, 'title') || (el.getElementsByTagName('title')[0] || {}).textContent ||
                        '';
                    var link = (el.getElementsByTagName('link')[0] || {}).textContent || '';
                    var lat = parseFloat(getTag(el, geoNS, 'lat', 'geo:lat'));
                    var lng = parseFloat(getTag(el, geoNS, 'long', 'geo:long'));
                    var depth = getTag(el, tmdNS, 'depth', 'tmd:depth');
                    var magnitude = parseFloat(getTag(el, tmdNS, 'magnitude', 'tmd:magnitude'));
                    var timeUTC = getTag(el, tmdNS, 'time', 'tmd:time');
                    var comments = (el.getElementsByTagName('comments')[0] || {}).textContent || '';
                    var pubDate = (el.getElementsByTagName('pubDate')[0] || {}).textContent || '';
                    var description = (el.getElementsByTagName('description')[0] || {}).textContent || '';

                    if (isNaN(lat) || isNaN(lng)) return null;

                    return {
                        id: 'q' + idx + '_' + lat + '_' + lng + '_' + timeUTC,
                        title: title.trim(),
                        link: link.trim(),
                        lat: lat,
                        lng: lng,
                        depth: depth,
                        magnitude: isNaN(magnitude) ? null : magnitude,
                        timeUTC: timeUTC,
                        comments: comments.trim(),
                        pubDate: pubDate.trim(),
                        description: description.trim()
                    };
                }).filter(Boolean);
            }

            // ========== RENDER ==========
            function render(quakes) {
                markersLayer.clearLayers();
                markerById = {};
                itemElById = {};

                var listEl = document.getElementById('list');
                listEl.innerHTML = '';

                if (!quakes.length) {
                    listEl.innerHTML = '<div class="empty-state">ไม่พบข้อมูลแผ่นดินไหวในขณะนี้</div>';
                }

                var maxMag = -Infinity,
                    nearestHours = Infinity;

                quakes.forEach(function(q) {
                    var color = sevColor(q.magnitude || 0);
                    if (q.magnitude !== null && q.magnitude > maxMag) maxMag = q.magnitude;
                    var ha = hoursAgo(q.pubDate);
                    if (ha !== null && ha < nearestHours) nearestHours = ha;

                    var marker = L.marker([q.lat, q.lng], { icon: quakeIcon }).addTo(markersLayer);
                    var popupHtml =
                        '<div class="pop-mag" style="background:' + color + '">M ' + (q.magnitude !== null ? q.magnitude
                            .toFixed(1) : '–') + '</div>' +
                        '<div class="pop-title">' + escapeHtml(q.title) + '</div>' +
                        '<div class="pop-row"><b>เวลา:</b> ' + escapeHtml(fmtDate(q.pubDate)) + '</div>' +
                        '<div class="pop-row"><b>ความลึก:</b> ' + escapeHtml(q.depth || '–') + ' กม.</div>' +
                        '<div class="pop-row"><b>พิกัด:</b> ' + q.lat.toFixed(3) + ', ' + q.lng.toFixed(3) + '</div>' +
                        (q.comments ? '<div class="pop-comment">' + escapeHtml(q.comments) + '</div>' : '') +
                        (q.link ? '<a class="pop-link" href="' + q.link + '" target="_blank" rel="noopener">ดูรายละเอียดที่ TMD →</a>' :
                            '');
                    marker.bindPopup(popupHtml, { maxWidth: 280 });
                    marker.on('click', function() { setActive(q.id); });
                    markerById[q.id] = marker;

                    var item = document.createElement('div');
                    item.className = 'quake-item';
                    item.dataset.id = q.id;
                    item.innerHTML =
                        '<div class="magnitude" style="background:' + color + '">' + (q.magnitude !== null ? q.magnitude
                            .toFixed(1) : '–') + '</div>' +
                        '<div class="qi-body">' +
                        '<div class="qi-title">' + escapeHtml(q.title) + '</div>' +
                        '<div class="qi-meta">' +
                        '<span>🕒 ' + escapeHtml(fmtDate(q.pubDate)) + '</span>' +
                        '<span>⇩ ' + escapeHtml(q.depth || '–') + ' กม.</span>' +
                        '</div>' +
                        '</div>';
                    item.addEventListener('click', function() {
                        setActive(q.id);
                        map.flyTo([q.lat, q.lng], Math.max(map.getZoom(), 8), { duration: 0.6 });
                        marker.openPopup();
                        if (window.innerWidth <= 640) {
                            sidebar.classList.add('collapsed');
                            collapseTab.classList.add('flipped');
                            setTimeout(function() { map.invalidateSize(); }, 340);
                        }
                    });
                    listEl.appendChild(item);
                    itemElById[q.id] = item;
                });

                document.getElementById('statCount').textContent = quakes.length;
                document.getElementById('statMax').textContent = isFinite(maxMag) ? maxMag.toFixed(1) : '–';
                document.getElementById('statLatest').textContent = isFinite(nearestHours) ? nearestHours.toFixed(1) :
                    '–';
            }

            function setActive(id) {
                Object.keys(itemElById).forEach(function(k) {
                    itemElById[k].classList.toggle('active', k === id);
                });
                if (itemElById[id]) itemElById[id].scrollIntoView({ block: 'nearest', behavior: 'smooth' });
            }

            function escapeHtml(str) {
                return String(str).replace(/[&<>"']/g, function(c) {
                    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' } [c];
                });
            }

            // ========== FETCH RSS WITH PROXY FALLBACK ==========
            function fetchRss() {
                var listEl = document.getElementById('list');
                var refreshBtn = document.getElementById('refreshBtn');
                refreshBtn.classList.add('spinning');
                listEl.innerHTML = '<div class="loading-state"><div class="spinner"></div>กำลังโหลดข้อมูลแผ่นดินไหว…</div>';

                var sources = [
                    RSS_URL,
                    'https://api.allorigins.win/raw?url=' + encodeURIComponent(RSS_URL),
                    'https://corsproxy.io/?' + encodeURIComponent(RSS_URL)
                ];

                function tryNext(i) {
                    if (i >= sources.length) {
                        refreshBtn.classList.remove('spinning');
                        listEl.innerHTML =
                            '<div class="error-state">โหลดข้อมูลไม่สำเร็จ อาจติดปัญหา CORS หรือเครือข่าย<br><button class="retry-btn" onclick="location.reload()">ลองอีกครั้ง</button></div>';
                        return;
                    }
                    fetch(sources[i], { cache: 'no-store' })
                        .then(function(res) {
                            if (!res.ok) throw new Error('HTTP ' + res.status);
                            return res.text();
                        })
                        .then(function(text) {
                            var quakes = parseRss(text);
                            if (!quakes.length) throw new Error('empty parse');
                            quakes.sort(function(a, b) { return new Date(b.pubDate) - new Date(a.pubDate); });
                            render(quakes);
                            refreshBtn.classList.remove('spinning');
                            document.getElementById('lastUpdated').textContent =
                                'อัปเดตล่าสุด ' + new Date().toLocaleTimeString('th-TH', { hour: '2-digit',
                                    minute: '2-digit' });
                        })
                        .catch(function() { tryNext(i + 1); });
                }
                tryNext(0);
            }

            document.getElementById('refreshBtn').addEventListener('click', fetchRss);
            fetchRss();
            setInterval(fetchRss, 5 * 60 * 1000);

            // ============================================================
            // ========== FAULT LAYER — ปุ่ม "ดูรอยเลื่อน" ==========
            // ============================================================
            var faultLayer = null;
            var faultGeoData = null;
            var faultLoading = false;
            var faultBtn = document.getElementById('faultToggleBtn');
            var faultVisible = false;

            function extractStrokeColor(desc) {
                if (!desc) return '#fb6033';
                var m = desc.match(/"stroke"\s*:\s*"(#[0-9a-fA-F]{3,6})"/);
                return m ? m[1] : '#fb6033';
            }

            function faultStyle(feature) {
                var color = extractStrokeColor(feature.properties && feature.properties.desc);
                return { color: color, weight: 2.5, opacity: 0.9 };
            }

            function addFaultLayerToMap() {
                if (!faultGeoData) return;
                if (faultLayer) {
                    map.removeLayer(faultLayer);
                    faultLayer = null;
                }
                faultLayer = L.geoJSON(faultGeoData, {
                    style: faultStyle,
                    onEachFeature: function(feature, layer) {
                        var name = feature.properties && feature.properties.name;
                        if (name) layer.bindTooltip(name, { sticky: true, direction: 'auto' });
                    }
                }).addTo(map);
            }

            function loadFaultData(callback) {
                if (faultGeoData) {
                    if (callback) callback();
                    return;
                }
                if (faultLoading) return;
                faultLoading = true;
                faultBtn.textContent = 'กำลังโหลด...';
                faultBtn.disabled = true;

                fetch(FAULT_URL, { cache: 'no-store' })
                    .then(function(res) {
                        if (!res.ok) throw new Error('HTTP ' + res.status);
                        return res.json();
                    })
                    .then(function(geojson) {
                        faultGeoData = geojson;
                        faultLoading = false;
                        faultBtn.disabled = false;
                        if (callback) callback();
                    })
                    .catch(function(err) {
                        console.error('โหลดรอยเลื่อนล้มเหลว:', err);
                        faultLoading = false;
                        faultBtn.disabled = false;
                        faultBtn.textContent = '⚠️ โหลดล้มเหลว';
                        setTimeout(function() {
                            faultBtn.textContent = 'ดูรอยเลื่อน';
                            faultBtn.classList.remove('active');
                            faultVisible = false;
                        }, 2000);
                    });
            }

            function toggleFault() {
                if (faultVisible) {
                    // ซ่อน
                    if (faultLayer) {
                        map.removeLayer(faultLayer);
                        faultLayer = null;
                    }
                    faultVisible = false;
                    faultBtn.classList.remove('active');
                    faultBtn.textContent = 'ดูรอยเลื่อน';
                } else {
                    // แสดง
                    if (faultGeoData) {
                        addFaultLayerToMap();
                        faultVisible = true;
                        faultBtn.classList.add('active');
                        faultBtn.textContent = 'ซ่อนรอยเลื่อน';
                    } else {
                        loadFaultData(function() {
                            if (faultGeoData) {
                                addFaultLayerToMap();
                                faultVisible = true;
                                faultBtn.classList.add('active');
                                faultBtn.textContent = 'ซ่อนรอยเลื่อน';
                            }
                        });
                    }
                }
            }

            faultBtn.addEventListener('click', toggleFault);

        })();
    </script>

</body>
